kind: topology
name: simple-topology
spec:
  constraints:
    traceLength:
      target: 8
      tolerance: 1
    distinctTraces:
      target: 75
      tolerance: 5
  generation:
    initialBranching: 1
  optimize:
    maxIterations: 10
    sampleSize: 1200
  payload:
    successThreshold: 80
    successfulCaseRatio:
      target: 80
      tolerance: 2
    entropy:
      target: 0.3
      tolerance: 0.1
  traceEntropy:
    target: 0.5
    tolerance: 0.1
