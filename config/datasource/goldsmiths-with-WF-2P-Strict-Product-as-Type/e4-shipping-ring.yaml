kind: datasource
name: "ShippingA"
spec:
  name: "ShippingA"
  group: "factory"
  type: objectCentric
  selection: genericProbability
  distribution: [ 0.2, 0.8 ]
  eventType: genericDecisions
  input:
    - object: "ringGold"
      number: 1
      lastState: "ring_shaped"
      size:
  eventData:
    - activity: "Package waits for sending"
      type: oc
      output:
        - object: "ringGold"
          number: 1
          change: "ring_shaped"
          size:
      transition: "Shipping"
      duration: 20
    - activity: "Package sent"
      type: oc
      output:
        - object: "ringGold"
          number: 1
          change: "shipped"
          size:
      transition: ""
      duration: 1