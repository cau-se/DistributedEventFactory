kind: datasource
name: "GoodsDelivery"
spec:
  name: "GoodsDelivery"
  group: "GoodsDelivery"
  type: default
  selection: driftingProbability
  startDistribution: [0.1, 0.7, 0.2]
  endDistribution: [0.1, 0.2, 0.7]
  steps: 1000
  eventType: eventData
  eventData:
    - activity: "Reject"
      type: "case"
      transition: "<end>"
      duration: 1
    - activity: "Store"
      type: "case"
      transition: "GoodsDelivery"
      duration:
        type: gaussian
        mu: 720
        sigma: 120
    - activity: "Pass To Production"
      type: "case"
      transition: "MaterialPreparation"
      duration:
        type: uniform
        lowerBound: 3
        upperBound: 7
