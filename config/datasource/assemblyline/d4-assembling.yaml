kind: datasource
name: "Assembling"
spec:
  name: "Assembling"
  group: "Assembling"
  type: default
  selection: genericProbability
  distribution: [ 0.8, 0.1, 0.08, 0.02 ]
  eventType: eventData
  eventData:
    - activity: "Assembling completed"
      type: "case"
      duration: 10
      transition: "QualityControl"
    - activity: "Overheating"
      type: "case"
      transition: "<end>"
      duration: 2
    - activity: "Item broke"
      type: "case"
      transition: "<end>"
      duration: 1
    - activity: "Internal Error"
      type: "case"
      transition: "Assembling"
      duration:
        type: gaussian
        mu: 500
        sigma: 100