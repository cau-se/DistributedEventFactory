kind: datasource
name: "TransportM1"
spec:
  name: "TransportM1"
  group: "transport"
  type: objectCentric
  selection: genericProbability
  distribution: [1.0]
  eventType: genericDecisions
  input:
    - object: "barResource"
      number: 1
      lastState: ""
  eventData:
    - activity: "transport from stock to M1"
      type: oc
      output:
        - object: "barResource"
          number: 1
          change: ""
        - object: "handover"
          number: 1
          change: ""
      transition: "SawingBar"
      duration: 10
