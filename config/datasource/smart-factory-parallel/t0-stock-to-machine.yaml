kind: datasource
name: "TransportM1"
spec:
  name: "TransportM1"
  group: "transport"
  type: objectCentric
  selection: genericProbability
  distribution: [1.0]
  input:
    - object: "barResource"
      number: 1
      lastState: ""
  eventData:
    - activity:
        name: "transport from stock to M1"
        output:
          - object: "barResource"
            number: 1
            change: ""
          - object: "handover"
            number: 1
            change: ""
      transition: "SawingBar"
      duration: 10
