kind: datasource
name: "Assembly"
spec:
  name: "Assembly"
  group: "factory"
  type: objectCentric
  workforce: noWorkforce
  start: "A"
  end: "A"
  workstation: "A"
  selection: genericProbability
  distribution: [ 0.8, 0.1, 0.1 ]
  input:
    - object: "bar"
      number: 4
      lastState: "sanded"
    - object: "screw"
      number: 13
      lastState: ""
    - object: "handover"
      number: 1
      lastState: ""
    - object: "handoverStock"
      number: 1
      lastState: ""
  eventData:
    - activity:
        name: "Assembling completed"
        output:
          - object: "woodShelf"
            number: 1
            change: "assembled"
      duration: 10
      transition: "Shipping"
    - activity:
        name: "Overheating"
        output:
          - object: "woodShelf"
            number: 1
            change: "overheated"
      transition: ""
      duration: 2
    - activity:
        name: "Item broke"
        output:
          - object: "woodShelf"
            number: 1
            change: "broke"
      transition: ""
      duration: 1