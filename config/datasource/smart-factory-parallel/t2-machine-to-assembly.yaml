kind: datasource
name: "TransportM1A"
spec:
  name: "TransportM1A"
  group: "transport"
  type: objectCentric
  workforce: hasWorkforce
  workstation: "R"
  start: "M"
  end: "A"
  selection: genericProbability
  distribution: [1.0]
  input:
    - object: "board"
      number: 3
      lastState: "sanded"
      size:
        length: ""
        width: "5"
        depth: "5"
  workforces:
    - workforce: "transportRobot"
      number: 1
  eventData:
    - activity:
        name: "transport from M1 to assembly"
        output:
          - object: "board"
            number: 3
            change: "sanded"
            size:
              length: ""
              width: "5"
              depth: "5"
          - object: "handover"
            number: 1
            change: ""
            size:
      transition: "Assembly"
      duration: 10
