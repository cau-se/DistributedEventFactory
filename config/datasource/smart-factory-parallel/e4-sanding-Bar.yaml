kind: datasource
name: "SandingBar"
spec:
  name: "SandingBar"
  group: "factory"
  type: objectCentric
  selection: genericProbability
  distribution: [1.0]
  eventType: genericDecisions
  input:
    - object: "bar"
      number: 1
      lastState: "drilled"
  eventData:
    - activity: "Sanded bar"
      type: oc
      output:
        - object: "bar"
          number: 1
          change: "sanded"
      transition: "TransportM1A"
      duration: 5
