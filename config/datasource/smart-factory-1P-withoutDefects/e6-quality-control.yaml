kind: datasource
name: "QualityControl"
spec:
  name: "QualityControl"
  group: "factory"
  type: objectCentric
  selection: genericProbability
  distribution: [ 1.0 ]
  eventType: genericDecisions
  input:
    - object: "woodShelf"
      number: 1
      lastState: "assembled"
      size:
  eventData:
    - activity: "Quality check passed"
      type: oc
      output:
        - object: "woodShelf"
          number: 1
          change: "proofed"
          size:
      transition: "Shipping"
      duration: 2

