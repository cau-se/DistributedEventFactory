kind: datasource
name: "GoodsDelivery"
spec:
  name: "GoodsDelivery"
  group: "factory"
  selection: driftingProbability
  startDistribution: [0.3, 0.7]
  endDistribution: [0.1, 0.9,]
  steps: 1000
  eventData:
    - activities:
      - activity: "Reject"
        transition: "<end>"
        duration: 1
    - activities:
      - activity: "Store"
        transition: "GoodsDelivery"
        duration:
          type: gaussian
          mu: 720
          sigma: 120
        output:
          - object:
            name: "screw"
            number: 2