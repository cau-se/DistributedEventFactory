kind: datasource
name: "SandingBar"
spec:
  name: "SandingBar"
  group: "factory"
  type: objectCentric
  workforce: hasWorkforce
  start: "M"
  end: "M"
  workstation: "M"
  selection: genericProbability
  distribution: [1.0]
  eventType: genericDecisions
  input:
    - object: "bar"
      number: 1
      lastState: "drilled"
      size:
        length: "2"
        width: ""
        depth: ""
  workforces:
    - workforce: "machineWorker"
      number: 1
  eventData:
    - activity: "Sanded bar"
      output:
        - object: "bar"
          number: 1
          change: "sanded"
          size:
            length: "2"
            width: ""
            depth: ""
      transition: "TransportM1A"
      duration: 2
      type: oc
