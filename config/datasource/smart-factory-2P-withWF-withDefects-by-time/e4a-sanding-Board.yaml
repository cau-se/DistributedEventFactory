kind: datasource
name: "SandingBoardA"
spec:
  name: "SandingBoardA"
  group: "factory"
  type: objectCentric
  workforce: hasWorkforce
  start: "Al"
  end: "Al"
  workstation: "Al"
  selection: genericProbability
  distribution: [1.0]
  input:
    - object: "boardA"
      number: 1
      lastState: "divided Resource"
      size:
        length: ""
        width: "5"
        depth: "5"
  workforces:
    - workforce: "machineWorker"
      number: 1
  eventData:
    - activity:
        name: "Sanded"
        output:
          - object: "boardA"
            number: 1
            change: "sanded"
            size:
              length: ""
              width: "5"
              depth: "5"
      transition: "Assembly2"
      duration: 2