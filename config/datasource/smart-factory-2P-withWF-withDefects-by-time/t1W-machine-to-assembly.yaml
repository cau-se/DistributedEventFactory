kind: datasource
name: "TransportMWA"
spec:
  name: "TransportMWA"
  group: "transport"
  type: objectCentric
  selection: genericProbability
  distribution: [1.0]
  eventType: genericDecisions
  input:
    - object: "barW"
      number: 4
      lastState: "sanded"
      size:
        length: "2"
        width: ""
        depth: ""
  eventData:
    - activity: "transport: MW -> assembly"
      type: oc
      output:
        - object: "barW"
          number: 4
          change: "sanded"
          size:
            length: "2"
            width: ""
            depth: ""
        - object: "handoverBar"
          number: 1
          change: ""
          size:
      transition: "Assembly"
      duration: 1
