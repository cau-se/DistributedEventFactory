kind: datasource
name: "SawingBarW"
spec:
  name: "SawingBarW"
  group: "factory"
  type: objectCentric
  selection: genericProbability
  distribution: [0.97, 0.01, 0.02]
  eventType: genericDecisions
  input:
    - object: "barWResource"
      number: 2
      lastState: ""
      size:
        length: "4"
        width: ""
        depth: ""
    - object: "handoverBarR"
      number: 1
      lastState: ""
      size:
  eventData:
    - activity: "Sawed"
      type: oc
      output:
        - object: "barW"
          number: 4
          change: "divided Resource"
          size:
            length: "2"
            width: ""
            depth: ""
      transition: "DrillingBarW"
      duration: 4
    - activity: "Failure: Sawing machine broken"
      type: oc
      output:
        - object: "barWResource"
          number: 2
          change: ""
          size:
            length: "4"
            width: ""
            depth: ""
        - object: "handoverBarR"
          number: 1
          change: ""
          size:
      duration: 20
      transition: ""
    - activity: "Failure: One piece broken"
      type: oc
      output:
        - object: "barW"
          number: 3
          change: "divided Resource"
          size:
            length: "2"
            width: ""
            depth: ""
        - object: "barW"
          number: 1
          change: "broken"
          size:
            length: "1.25"
            width: ""
            depth: ""
      duration: 4
      transition: "DrillingBarW"