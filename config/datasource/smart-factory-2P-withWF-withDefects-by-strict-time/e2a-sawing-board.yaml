kind: datasource
name: "SawingBoardA"
spec:
  name: "SawingBoardA"
  group: "factory"
  type: objectCentric
  workforce: hasWorkforce
  start: "Al"
  end: "Al"
  workstation: "Al"
  selection: genericProbability
  distribution: [0.97, 0.01, 0.02]
  input:
    - object: "boardAResource"
      number: 1
      lastState: ""
      size:
        length: ""
        width: "30"
        depth: "30"
    - object: "handoverBoardRA"
      number: 1
      lastState: ""
      size:
  workforces:
    - workforce: "machineWorker"
      number: 1
  eventData:
    - activity:
        name: "Sawed"
        output:
          - object: "boardA"
            number: 6
            change: "divided Resource"
            size:
              length: ""
              width: "5"
              depth: "5"
      transition: "SandingBoardA"
      duration: 9
    - activity:
        name: "Failure: Sawing machine broken"
        output:
          - object: "boardAResource"
            number: 1
            change: ""
            size:
              length: ""
              width: "30"
              depth: "30"
          - object: "handoverBoardRA"
            number: 1
            change: ""
            size:
      duration: 20
      transition: ""
    - activity:
        name: "Failure: One piece broken"
        output:
          - object: "boardA"
            number: 4
            change: "divided Resource"
            size:
              length: ""
              width: "5"
              depth: "5"
          - object: "boardA"
            number: 2
            change: "broken"
            size:
              length: ""
              width: "4.32"
              depth: "4.24"
      duration: 4
      transition: "SandingBoardA"