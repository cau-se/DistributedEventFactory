kind: datasource
name: "Assembly"
spec:
  name: "Assembly"
  group: "factory"
  type: objectCentric
  selection: genericProbability
  distribution: [ 0.8, 0.1, 0.1 ]
  input:
    - object: "bar"
      number: 4
    - object: "screw"
      number: 13
  eventData:
    - activity:
        name: "Assembling completed"
        output:
          - object: "woodShelf"
            number: 1
      duration: 10
      transition: "Shipping"
    - activity:
        name: "Overheating"
        output:
          - object: "woodShelf"
            number: 1
      transition: "<end>"
      duration: 2
    - activity:
        name: "Item broke"
        output:
          - object: "woodShelf"
            number: 1
      transition: "<end>"
      duration: 1