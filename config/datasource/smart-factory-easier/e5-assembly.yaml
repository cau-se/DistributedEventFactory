kind: datasource
name: "Assembly"
spec:
  name: "Assembly"
  group: "factory"
  type: objectCentric
  selection: genericProbability
  distribution: [ 0.8, 0.1, 0.1 ]
  eventType: genericDecisions
  input:
    - object: "bar"
      number: 4
      lastState: "sanded"
    - object: "screw"
      number: 13
      lastState: ""
  eventData:
    - activity: "Assembling completed"
      type: oc
      output:
        - object: "woodShelf"
          number: 1
          change: "assembled"
      duration: 10
      transition: "Shipping"
    - activity: "Overheating"
      type: oc
      output:
        - object: "woodShelf"
          number: 1
          change: "overheated"
      transition: "<end>"
      duration: 2
    - activity: "Item broke"
      type: oc
      output:
        - object: "woodShelf"
          number: 1
          change: "broke"
      transition: "<end>"
      duration: 1