kind: datasource
name: "OutgoingStock"
spec:
  name: "OutgoingStock"
  group: "factory"
  type: objectCentric
  selection: parallel
  input:
    - object: "order"
      number: 1
      lastState: ""
  eventData:
    - activity:
        name: "Sent to sawing machine"
        output:
          - object: "barResource"
            number: 1
            change: ""
      duration: 3
      transition: "<routing>"
    - activity:
        name: "Sent to assembly station"
        output:
          - object: "screw"
            number: 13
            change: ""
      duration: 2
      transition: "<routing>"