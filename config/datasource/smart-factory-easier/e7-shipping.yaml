kind: datasource
name: "Shipping"
spec:
  name: "Shipping"
  group: "factory"
  type: objectCentric
  selection: genericProbability
  distribution: [ 0.8, 0.2 ]
  input:
    - object: "woodShelf"
      number: 1
  eventData:
    - activity:
        name: "Package waits for sending"
        output:
          - object: "woodShelf"
            number: 1
      transition: "Shipping"
      duration: 180
    - activity:
        name: "Package sent"
        output:
          - object: "woodShelf"
            number: 1
      transition: "<end>"
      duration: 1