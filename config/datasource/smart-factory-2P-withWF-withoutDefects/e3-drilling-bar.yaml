kind: datasource
name: "DrillingBarW"
spec:
  name: "DrillingBarW"
  group: "factory"
  type: objectCentric
  selection: genericProbability
  distribution: [1.0]
  eventType: genericDecisions
  input:
    - object: "barW"
      number: 1
      lastState: "divided Resource"
      size:
        length: "2"
        width: ""
        depth: ""
  eventData:
    - activity: "Drilled"
      type: oc
      output:
        - object: "barW"
          number: 1
          change: "drilled"
          size:
            length: "2"
            width: ""
            depth: ""
      transition: "SandingBarW"
      duration: 3