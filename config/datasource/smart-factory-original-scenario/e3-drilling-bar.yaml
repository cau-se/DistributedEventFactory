kind: datasource
name: "DrillingBarW"
spec:
  name: "DrillingBarW"
  group: "factory"
  type: objectCentric
  selection: genericProbability
  distribution: [0.99, 0.01]
  eventType: genericDecisions
  input:
    - object: "barW"
      number: 1
      lastState: "divided Resource"
      size:
        length: "50"
        width: ""
        depth: ""
  eventData:
    - activity: "Drilled"
      type: oc
      output:
        - object: "barW"
          number: 1
          change: "drilled"
          size:
            length: "50"
            width: ""
            depth: ""
      transition: ""
      duration: 3
    - activity: "Failure: Drilling machine broken"
      type: oc
      output:
        - object: "barW"
          number: 1
          change: "divided Resource"
          size:
            length: "50"
            width: ""
            depth: ""
      duration: 20
      transition: ""