kind: datasource
name: "DrillingBarW"
spec:
  name: "DrillingBarW"
  group: "factory"
  type: objectCentric
  workforce: hasWorkforce
  start: "W"
  end: "W"
  workstation: "W"
  selection: genericProbability
  distribution: [0.99, 0.01]
  input:
    - object: "barW"
      number: 1
      lastState: "divided Resource"
      size:
        length: "50"
        width: ""
        depth: ""
  workforces:
    - workforce: "machineWorker"
      number: 1
  eventData:
    - activity:
        name: "Drilled"
        output:
          - object: "barW"
            number: 1
            change: "drilled"
            size:
              length: "50"
              width: ""
              depth: ""
      transition: ""
      duration: 3
    - activity:
        name: "Failure: Drilling machine broken"
        output:
          - object: "barW"
            number: 1
            change: "divided Resource"
            size:
              length: "50"
              width: ""
              depth: ""
      duration: 20
      transition: ""