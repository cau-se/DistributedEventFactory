kind: datasource
name: "SawingBarW"
spec:
  name: "SawingBarW"
  group: "factory"
  type: objectCentric
  selection: genericProbability
  distribution: [0.97, 0.01, 0.02]
  eventType: genericDecisions
  input:
    - object: "barWResource"
      number: 1
      lastState: ""
      size:
        length: "200"
        width: ""
        depth: ""
    - object: "crossWResource"
      number: 1
      lastState: ""
      size:
        length: "160"
        width: ""
        depth: ""
    - object: "handoverBarR"
      number: 1
      lastState: ""
      size:
  eventData:
    - activity: "Sawed"
      type: oc
      output:
        - object: "barW"
          number: 4
          change: "divided Resource"
          size:
            length: "50"
            width: ""
            depth: ""
        - object: "crossW"
          number: 6
          change: "divided Resource"
          size:
            length: "20"
            width: ""
            depth: ""
      transition: ""
      duration: 8
    - activity: "Failure: Sawing machine broken"
      type: oc
      output:
        - object: "barWResource"
          number: 1
          change: ""
          size:
            length: "200"
            width: ""
            depth: ""
        - object: "crossWResource"
          number: 1
          change: ""
          size:
            length: "160"
            width: ""
            depth: ""
        - object: "handoverBarR"
          number: 1
          change: ""
          size:
      duration: 20
      transition: ""
    - activity: "Failure: One piece broken"
      type: oc
      output:
        - object: "barW"
          number: 3
          change: "divided Resource"
          size:
            length: "50"
            width: ""
            depth: ""
        - object: "crossW"
          number: 4
          change: "divided Resource"
          size:
            length: "20"
            width: ""
            depth: ""
        - object: "barW"
          number: 1
          change: "broken"
          size:
            length: "41.25"
            width: ""
            depth: ""
        - object: "crossW"
          number: 2
          change: "broken"
          size:
            length: "17.5"
            width: ""
            depth: ""
      duration: 8
      transition: ""