kind: datasource
name: "TransportMW"
spec:
  name: "TransportMW"
  group: "transport"
  type: objectCentric
  workforce: hasWorkforce
  workstation: "R4"
  start: "STW"
  end: "W"
  selection: genericProbability
  distribution: [1.0]
  input:
    - object: "barWResource"
      number: 1
      lastState: ""
      size:
        length: "200"
        width: ""
        depth: ""
    - object: "crossWResource"
      number: 1
      lastState: ""
      size:
        length: "160"
        width: ""
        depth: ""
  workforces:
    - workforce: "transportRobot"
      number: 1
  eventData:
    - activity:
        name: "transport: stock -> MW"
        output:
          - object: "barWResource"
            number: 1
            change: ""
            size:
              length: "200"
              width: ""
              depth: ""
          - object: "crossWResource"
            number: 1
            change: ""
            size:
              length: "160"
              width: ""
              depth: ""
          - object: "handoverBarR"
            number: 1
            change: ""
            size:
      transition: "SawingBarW"
      duration: 1
