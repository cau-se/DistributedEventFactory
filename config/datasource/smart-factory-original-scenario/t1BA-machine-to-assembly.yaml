kind: datasource
name: "TransportMAlAB"
spec:
  name: "TransportMAlAB"
  group: "transport"
  type: objectCentric
  selection: genericProbability
  distribution: [1.0]
  eventType: genericDecisions
  input:
    - object: "boardA"
      number: 3
      lastState: "sanded"
      size:
        length: ""
        width: "20"
        depth: "20"
  eventData:
    - activity: "transport: MAl -> assembly"
      type: oc
      output:
        - object: "boardA"
          number: 3
          change: "sanded"
          size:
            length: ""
            width: "20"
            depth: "20"
        - object: "handoverBoardA"
          number: 1
          change: ""
          size:
      transition: "Assembly"
      duration: 1
