    - activity: "order for resources"
      type: oc
      output:
        - object: "resourceOrder1"
          number: 1
          change: ""
          size:
      transition: ""
      duration: 0
    - activity: "buying resources"
      type: oc
      output:
        - object: "order1"
          number: 1
          change: ""
          size:
        - object: "orderBuyResource"
          number: 1
          change: ""
          size:
      transition: "ResourceDelivery"
      duration: 20
