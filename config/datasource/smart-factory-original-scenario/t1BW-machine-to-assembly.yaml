kind: datasource
name: "TransportMWAB"
spec:
  name: "TransportMWAB"
  group: "transport"
  type: objectCentric
  selection: genericProbability
  distribution: [1.0]
  eventType: genericDecisions
  input:
    - object: "boardW"
      number: 5
      lastState: "sanded"
      size:
        length: ""
        width: "40"
        depth: "30"
  eventData:
    - activity: "transport: MW -> assembly"
      type: oc
      output:
        - object: "boardW"
          number: 5
          change: "sanded"
          size:
            length: ""
            width: "40"
            depth: "30"
        - object: "handoverBoard"
          number: 1
          change: ""
          size:
      transition: "Assembly"
      duration: 1
